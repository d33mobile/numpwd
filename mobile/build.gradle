apply plugin: 'com.android.application'

android {
    compileSdk = 36
    namespace = 'net.d33.numpwd'
    defaultConfig {
        applicationId = "net.d33.numpwd"
        minSdk = 23
        targetSdk = 36
        versionCode = 4
        versionName = "1.3"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // Release signing comes from the environment so the keystore never enters the repo.
            storeFile = System.getenv('NUMPWD_KEYSTORE') ? file(System.getenv('NUMPWD_KEYSTORE')) : null
            storePassword = System.getenv('NUMPWD_KEYSTORE_PASS')
            keyAlias = System.getenv('NUMPWD_KEY_ALIAS')
            keyPassword = System.getenv('NUMPWD_KEY_PASS')
        }
    }
    buildTypes {
        release {
            if (System.getenv('NUMPWD_KEYSTORE'))
                signingConfig = signingConfigs.release
            minifyEnabled = false
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            def vectors = System.getenv('NUMPWD_VECTORS')
            if (vectors)
                inputs.file(vectors)
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                showStandardStreams = true
            }
        }
    }
    androidResources {
        generateLocaleConfig = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
