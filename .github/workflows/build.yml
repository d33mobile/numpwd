name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, lint
        run: ./gradlew --no-daemon :mobile:assembleDebug :mobile:assembleDebugAndroidTest :mobile:testDebugUnitTest :mobile:lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: mobile/build/reports/

  # Regenerates the test vectors with the runner's openssl, so the port is checked
  # against a second openssl build and a new random seed on every run.
  vector-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci-vector-check.sh "${{ github.run_id }}"

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          # The token lets the fingerprint tests drive the emulator console (finger touch).
          script: ./gradlew --no-daemon :mobile:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.emulatorConsoleToken="$(cat ~/.emulator_console_auth_token)"
